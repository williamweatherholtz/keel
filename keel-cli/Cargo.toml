[package]
name = "keel-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keel — an AI-complemented, SysML v2-text work-tracking engine with strict, computed discipline (the `keel` CLI)."
readme = "../README.md"
keywords = ["sysml", "mbse", "work-tracking", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
keel-parser = { path = "../keel-parser" }
# D0479 leaf members (sprint 714); each is re-exported under its old module path in lib.rs.
keel-perf = { path = "../members/keel-perf" }
keel-git = { path = "../members/keel-git" }
keel-json = { path = "../members/keel-json" }
keel-actor = { path = "../members/keel-actor" }
keel-schema = { path = "../members/keel-schema" }
keel-github = { path = "../members/keel-github" }
# D0479 read model and write API (sprint 718); re-exported under their old module paths in lib.rs.
keel-fs = { path = "../members/keel-fs" }
keel-model = { path = "../members/keel-model" }
keel-write = { path = "../members/keel-write" }
# OS CSPRNG for UUID v4 identity (issue075/D0129) — already in the lock tree transitively.
getrandom = "0.3"
# HMAC-SHA256 for device-bound deck taps (D0201 B) - already in the lock tree via keel-parser.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
include_dir = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "process", "io-util", "time", "sync"] }
axum = "0.7"
async-stream = "0.3"
tokio-stream = "0.1"

[dev-dependencies]
cucumber = { version = "0.20", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "cli_bdd"
harness = false

[[test]]
name = "orient_bdd"
harness = false

[[test]]
name = "write_bdd"
harness = false
