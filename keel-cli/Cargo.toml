[package]
name = "keel-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Keel — an AI-complemented, SysML v2-text work-tracking engine with strict, computed discipline (the `keel` CLI)."
readme = "../README.md"
keywords = ["sysml", "mbse", "work-tracking", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
keel-parser = { path = "../keel-parser" }
# D0479 leaf members (sprint 714); each is re-exported under its old module path in lib.rs.
keel-perf = { path = "../members/keel-perf" }
keel-git = { path = "../members/keel-git" }
# D0479 shared argument helpers (sprint 740): root_arg, flag, prose_flag and the rest; re-exported as `args` in lib.rs.
keel-args = { path = "../members/keel-args" }
keel-json = { path = "../members/keel-json" }
keel-actor = { path = "../members/keel-actor" }
keel-schema = { path = "../members/keel-schema" }
keel-github = { path = "../members/keel-github" }
# D0479 read model and write API (sprint 718); re-exported under their old module paths in lib.rs.
keel-fs = { path = "../members/keel-fs" }
keel-model = { path = "../members/keel-model" }
keel-write = { path = "../members/keel-write" }
# D0479 view layer (sprint 732): view, govern, pm, arch, control_proof; re-exported under their old module paths in lib.rs.
keel-view = { path = "../members/keel-view" }
# D0479 forward guards (sprint 733): one module per guard family plus receipt, contentkey, hardening, plan_cover; `guards` is the crate itself.
keel-guards = { path = "../members/keel-guards" }
# D0479 build-and-test tooling (sprint 735): suite, touched, verify, hook_binary, contentkey; re-exported under their old module paths in lib.rs.
keel-suite = { path = "../members/keel-suite" }
# D0479 governance processes (sprint 736): process_cmd, library, adoption_check, migrate, workspace, sync, status, currency; re-exported under their old module paths in lib.rs.
keel-process = { path = "../members/keel-process" }
# D0480 item processes (sprint 737): github_ingest, intake_write, the issue write and the item views; re-exported under their old paths in lib.rs.
keel-issues = { path = "../members/keel-issues" }
# D0479 console (sprint 738): serve, deck, launcher, console_registry, reports, attestation; re-exported under their old paths in lib.rs.
keel-serve = { path = "../members/keel-serve" }
# D0479 Claude hooks (sprint 739): cmd_hook and its ledger, shellcheck, proactive; re-exported as `hooks` and under the old module paths in lib.rs.
keel-hooks = { path = "../members/keel-hooks" }
# OS CSPRNG for UUID v4 identity (issue075/D0129) — already in the lock tree transitively.
getrandom = "0.3"
# HMAC-SHA256 for device-bound deck taps (D0201 B) - already in the lock tree via keel-parser.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
include_dir = "0.7"

[dev-dependencies]
cucumber = { version = "0.20", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "cli_bdd"
harness = false

[[test]]
name = "orient_bdd"
harness = false

[[test]]
name = "write_bdd"
harness = false
