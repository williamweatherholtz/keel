[package]
name = "keel-write"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The write API: every authored fact enters the tree through here, under one lock, atomically, provenance bound."
# The Claude surface stamps the build that wrote it (claude_surface::SURFACE_BUILD); the script that
# bakes the commit is keel-cli's, shared, not copied (sprint 733).
build = "../../keel-cli/build.rs"

[dependencies]
keel-parser = { path = "../../keel-parser" }
keel-fs = { path = "../keel-fs" }
keel-model = { path = "../keel-model" }
keel-git = { path = "../keel-git" }
keel-json = { path = "../keel-json" }
keel-actor = { path = "../keel-actor" }
keel-schema = { path = "../keel-schema" }
# The slow-fire attribution the ledger line carries (D0414), with the threshold, since sprint 740.
keel-perf = { path = "../keel-perf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
